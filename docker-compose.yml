# Local development infrastructure for Kampora.
# Storage uses the local-disk driver in dev (STORAGE_DRIVER=local). MinIO's public images now require
# registry auth; point STORAGE_DRIVER=s3 at any S3-compatible endpoint (or AWS) to use the S3 driver.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kampora
      POSTGRES_PASSWORD: kampora
      POSTGRES_DB: kampora
    ports: ['5433:5432'] # 5433 avoids clashing with a locally installed Postgres
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kampora']
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports: ['6379:6379']
    volumes: ['redisdata:/data']


volumes:
  pgdata:
  redisdata:
